<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cementerio General — Recorrido Nocturno Inmersivo</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090a0f;
      --bg-card: #12141d;
      --bg-card-hover: #181b26;
      --text-main: #f3f4f6;
      --text-silver: #9ca3af;
      --accent-silver: #d1d5db;
      --accent-glow: rgba(209, 213, 219, 0.25);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.04em;
    }

    /* 1. HERO SECTION */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background-image: linear-gradient(to bottom, rgba(9, 10, 15, 0.55) 0%, rgba(9, 10, 15, 0.85) 75%, var(--bg-dark) 100%),
                        url('fondo-cementerio.jpg'),
                        radial-gradient(circle at 50% 25%, #23293a 0%, #090a0f 75%);
      background-size: cover;
      background-position: center;
    }

    .hero-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--text-silver);
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-subtle);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(18, 20, 29, 0.6);
      backdrop-filter: blur(6px);
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4.5vw, 3.4rem);
      font-weight: 700;
      color: #ffffff;
      max-width: 900px;
      line-height: 1.25;
      margin-bottom: 2.2rem;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.85);
    }

    .btn-start {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.2rem;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.35s ease;
    }

    .btn-start:hover {
      background: #ffffff;
      color: var(--bg-dark);
      box-shadow: 0 0 25px var(--accent-glow);
      transform: translateY(-2px);
    }

    /* 2. SECCIÓN INFORMATIVA */
    .intro-section {
      padding: 5rem 1.5rem 3rem;
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
    }

    .intro-box {
      background: linear-gradient(145deg, #131620, #0d0f16);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .intro-box::before {
      content: "✦";
      display: block;
      font-size: 1.4rem;
      color: var(--text-silver);
      margin-bottom: 1rem;
    }

    .intro-box p {
      font-size: clamp(1.05rem, 2vw, 1.22rem);
      color: var(--accent-silver);
      font-weight: 300;
    }

    /* 3. SECCIÓN DE LOS 11 HITOS */
    .hitos-section {
      padding: 3rem 1.5rem 5rem;
      max-width: 1150px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-header h2 {
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .section-header p {
      color: var(--text-silver);
      font-size: 0.95rem;
    }

    .hitos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.75rem;
      align-items: start;
    }

    .hito-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.75rem;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .hito-card:hover {
      border-color: rgba(209, 213, 219, 0.25);
      background-color: var(--bg-card-hover);
    }

    .hito-number {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-silver);
      display: block;
      margin-bottom: 0.4rem;
    }

    .hito-card h3 {
      font-size: 1.2rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
      line-height: 1.35;
    }

    .hito-meta {
      font-size: 0.82rem;
      color: var(--text-silver);
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    /* REPRODUCTOR MP3 */
    .custom-player {
      background: rgba(9, 10, 15, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.9rem;
      transition: all 0.25s ease;
    }

    .play-btn:hover {
      background: #ffffff;
      color: var(--bg-dark);
    }

    .progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .progress-bar {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-silver);
      font-variant-numeric: tabular-nums;
    }

    /* TRANSCRIPCIÓN DESPLEGABLE */
    .transcript-toggle {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--accent-silver);
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }

    .transcript-toggle:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    .transcript-content {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.9rem;
      color: #d1d5db;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .transcript-content.open {
      display: block;
    }

    .transcript-content p {
      margin-bottom: 0.85rem;
    }

    .transcript-content em {
      color: #9ca3af;
      font-style: italic;
    }

    /* 4. MAPA */
    .map-section {
      padding: 4rem 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .map-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .map-frame {
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: zoom-in;
      background: #0d0f15;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-frame img {
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      display: block;
    }

    .map-controls {
      margin-top: 1.25rem;
    }

    .btn-map {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.7rem 1.5rem;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-map:hover {
      background: #ffffff;
      color: var(--bg-dark);
    }

    /* MODAL ZOOM MAPA */
    .map-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 9, 0.95);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .map-modal.active {
      display: flex;
    }

    .modal-toolbar {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.6rem;
      z-index: 10000;
    }

    .modal-btn {
      background: #1f2433;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .modal-scroll-area {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-scroll-area img {
      max-width: 95%;
      max-height: 90vh;
      transition: transform 0.25s ease;
    }

    /* 5. ENCUESTA */
    .survey-section {
      padding: 4rem 1.5rem 6rem;
      max-width: 680px;
      margin: 0 auto;
    }
