Hito 01
El principio

📍 Tumba de Manuel Joaquín Valdivieso
⏱ Duración: 4 minutos

▶


0:004:00


Leer transcripción▾

Voz narradora: Masculina adulta, tono cercano, reflexivo, emotivo e histórico.
(Sonido ambiente: viento suave. A lo lejos se escuchan ruedas de carretas avanzando sobre caminos de tierra.)
Nuestra primera historia nos lleva al año 1821. En ese entonces, donde hoy se encuentra el Cementerio General solo había terrenos abiertos en las afueras de Santiago. Sin embargo, mientras la ciudad crecía y se expandía, los espacios destinados a sepultar a los fallecidos comenzaban a ser insuficientes.
(Suenan levemente campanas de iglesia.)
Durante años, los entierros se realizaron principalmente en iglesias, conventos y hospitales. Pero el aumento de la población hizo evidente la necesidad de crear un lugar destinado exclusivamente para dar sepultura y preservar la memoria de quienes partían.
Fue en ese momento cuando Manuel Joaquín Valdivieso pasó a desempeñar un papel clave en esta historia…
Fue uno de los principales impulsores de este proyecto. Como parte de la comisión encargada, trabajó para convertir aquella necesidad en una realidad y dar origen al primer cementerio público de Santiago.
(Comienzan a escucharse herramientas de construcción y el paso de carretas.)
Así comenzó un proyecto que, con el paso de los meses, transformó estos terrenos abiertos en un nuevo espacio para la ciudad, con eso poco a poco se levantaron los primeros muros, se trazaron los caminos y este lugar comenzó a tomar forma…
Finalmente, el 9 de diciembre de 1821, el Director Supremo Bernardo O'Higgins inauguró oficialmente el Cementerio General.
(Sonido de una gran puerta de hierro abriéndose.)
Con su inauguración no solo nació uno de los cementerios más importantes de Chile. También comenzó una nueva etapa para Manuel Joaquín Valdivieso, quien asumió como el primer administrador del recinto y acompañó sus primeros años de funcionamiento…
(El sonido ambiente vuelve a quedarse solo con el viento.)
Hoy, más de dos siglos después, te encuentras frente a la tumba de uno de los hombres que hizo posible el origen de este lugar… Aunque muchas personas pasan junto a ella sin conocer su historia, su legado permanece en cada uno de los caminos que recorrerás a partir de ahora, recordándonos que toda gran historia tiene un comienzo... y esta fue la suya..

Hito 02
“Un sabor… curioso…”

📍 Intersección calle Echaurren con Infante
⏱ Duración: 3 minutos

▶


0:003:00


Leer transcripción▾

Voz narradora: Una voz de una mujer joven, misteriosa
(Se escuchan guitarras, palmas, risas, conversaciones y una cueca a lo lejos. El ambiente se mantiene durante unos segundos y luego la música disminuye lentamente, mientras las voces continúan de fondo.)
¿Te recuerda algo este ambiente?
Quizás una fonda... una fiesta... o una celebración…
Puede parecer extraño, pero hace más de un siglo este lugar también se llenaba de vida… Cuando pensamos en un cementerio, imaginamos silencio, respeto y recogimiento.
(El ambiente festivo desaparece y queda un suave sonido de viento.)
Sin embargo, durante el siglo XIX, justo luego de la inauguración del cementerio, en fechas como el Día de Todos los Santos y el Día de los Difuntos, el Cementerio General recibía a miles de personas que llegaban para visitar a sus familiares, dejar flores y recordar a quienes ya no estaban. Muchas permanecían durante horas recorriendo sus calles y, como era de esperarse, donde había tantos visitantes también comenzaban a instalarse vendedores…
(Se escuchan ruedas de carros de comida y vendedores ofreciendo sus productos.)
Entre todos los alimentos que ofrecían, las empanadas eran una de las opciones más populares, ya que eran las más económicas y acompañaban a quienes pasaban gran parte del día en este lugar. Sin embargo, fue a partir de ese momento cuando comenzó a circular un rumor que, con el tiempo, terminaría convirtiéndose en una de las leyendas más conocidas del Cementerio General.
Una frase empezó a repetirse entre los visitantes, casi siempre en voz baja:
—"Dicen que algunas empanadas están hechas con carne de difunto..." (Susurrando)
A partir de ese momento, el comentario comenzó a pasar de una persona a otra… Mientras algunos lo tomaban como una simple broma entre vendedores, otros preferían creer que había algo de verdad en la historia… Lo cierto es que nadie sabía quién había iniciado aquel rumor, y quizás por eso resultaba tan difícil dejar de pensar en él…
Con el paso de los días, la duda fue creciendo, hasta que las empanadas dejaron de ser solo un alimento y comenzaron a generar desconfianza… porque bastaba escuchar aquella historia una sola vez para comenzar a mirarlas de otra manera…
(Se escuchan suaves susurros).
Los años pasaron, los vendedores cambiaron y las celebraciones también. Sin embargo, el rumor permaneció y terminó formando parte de la memoria del Cementerio General. Porque el tiempo puede borrar personas, fechas e incluso lugares, pero no siempre logra borrar las historias que alguna vez hicieron dudar a toda una comunidad.

Hito 03
Bernardo O’Higgins, el hombre que nunca dejó de regresar

📍 Sector vinculado a Bernardo O’Higgins
⏱ Duración: 4 minutos

▶


0:004:00


Leer transcripción▾

Voz narradora: Masculina adulta, voz grave, cálida y reflexiva.
(Sonido ambiente: viento suave entre los árboles, pájaros y pasos sobre gravilla.)
Bernardo O’Higgins murió en 1842 en Lima, Perú, lejos del país que había ayudado a independizar. Durante casi treinta años, sus restos permanecieron allí, mientras en Chile su nombre seguía formando parte de la historia de la naciente República.
(Se escuchan campanas a lo lejos y el sonido de un barco sobre el mar, representando el viaje de regreso.)
En 1869, el gobierno decidió repatriar sus restos. Su regreso simbolizó el reconocimiento de uno de los principales protagonistas de la independencia y de su aporte a la construcción del país.
Pero la relación entre Bernardo O’Higgins y el Cementerio General había comenzado mucho antes.
(Transición sonora: páginas antiguas pasando, una pluma escribiendo y murmullos de una reunión.)
A comienzos del siglo XIX, Santiago enfrentaba un problema sanitario. Los entierros se realizaban en iglesias y conventos, por lo que era necesario crear un espacio destinado exclusivamente a las sepulturas.
En 1821, siendo Director Supremo, Bernardo O’Higgins entregó el respaldo político para hacer realidad este proyecto. La organización estuvo a cargo de distintas autoridades, entre ellas Manuel Joaquín Valdivieso, quien tuvo un papel clave en el desarrollo de la obra.
(Sonido de herramientas de construcción de la época: palas cavando tierra, golpes suaves de martillo y una carreta de madera pasando lentamente.)
Así nació el Cementerio General, un lugar pensado para responder a las necesidades de una ciudad en crecimiento y que, con el tiempo, se transformaría en uno de los espacios patrimoniales más importantes de Chile.
(Regresan el viento y los pasos sobre hojas secas.)
Décadas después ocurrió una coincidencia histórica. En 1869, los restos de Bernardo O’Higgins llegaron a este mismo cementerio y fueron sepultados en el Patio Gótico.
Durante años, miles de personas visitaron ese lugar para rendir homenaje a quien había contribuido a la independencia del país.
(Suena una marcha solemne muy lejana y luego se desvanece.)
Sin embargo, ese no sería su descanso definitivo. En 1979 sus restos fueron trasladados al Altar de la Patria, frente al Palacio de La Moneda.
(Se escuchan pasos firmes de una guardia de honor y un redoble suave de tambor.)
Años más tarde, en 2006, fueron trasladados nuevamente a la Cripta del Libertador, bajo la Plaza de la Ciudadanía, donde permanecen hasta hoy.
(Viento entre los cipreses y hojas moviéndose.)
Cada uno de estos traslados refleja cómo la memoria de Bernardo O’Higgins ha cambiado con el paso del tiempo. Más allá del lugar donde descansan sus restos, su historia continúa formando parte de la identidad de Chile.
Hoy, mientras recorres el Cementerio General, puedes descubrir que este espacio no solo conserva tumbas y monumentos. También resguarda las historias de quienes ayudaron a construir el país y mantiene viva la memoria de generaciones enteras.
(Sonido final: pasos alejándose sobre gravilla, viento entre los árboles y campanas lejanas. El ambiente se desvanece lentamente.)

Hito 04
“La Mulan”

📍 Mausoleo Cuerpo de Inválidos - Veteranos del 79
⏱ Duración: 4 minutos

▶


0:004:00


Leer transcripción▾

Voz narradora: Femenina adulta reflexiva
(Sonido ambiente: viento suave entre los árboles, hojas moviéndose y un leve canto de pájaros.)
Hace unos momentos conocimos la historia de Bernardo O'Higgins, uno de los hombres que ayudó a construir el Chile independiente.
Décadas después, cuando ese mismo país volvió a enfrentarse a una guerra, otra persona demostraría que el verdadero valor no dependía del rango, la riqueza... ni siquiera del género.
Su nombre era Irene Morales.
(campanas de iglesia a lo lejos, voces de un barrio popular y pasos sobre tierra.)

(Se escuchan plumas escribiendo, conversaciones en voz baja y el sonido de un reloj antiguo.)
La historia de Rosario es una de ellas. Todo comenzó en el Santiago del siglo XIX, cuando la medicina aún tenía muchas limitaciones y declarar la muerte de una persona no siempre era tan sencillo como parece hoy.
(Tos débil, respiración agitada, agua sirviéndose en un vaso y susurros familiares.)
Rosario enfermó repentinamente y su estado empeoró con rapidez. Tras ser declarada fallecida, su familia comenzó a prepararla para el último adiós. Entre quienes la acompañaban estaba su hermana Carmen, quien, siguiendo la costumbre de la época, ató sus manos con un pañuelo en forma de cruz.
(Llantos suaves, el roce de una tela y campanas de iglesia a la distancia.)
Aquel gesto parecía ser una despedida más, pero con el paso de los años terminaría convirtiéndose en la clave de una de las leyendas más conocidas del Cementerio General.
(El sonido de un reloj marcando el paso del tiempo. El viento mueve las hojas.)
Los años pasaron y Carmen terminó casándose con Mariano Egaña, el viudo de Rosario y cuenta la leyenda que tiempo después, cuando Carmen falleció, la familia decidió reunir nuevamente a las dos hermanas en la misma sepultura.
(Golpes de herramientas sobre piedra, una puerta de hierro abriéndose, madera crujiendo y murmullos de sorpresa.)
Fue entonces cuando, según cuenta la leyenda, ocurrió algo inesperado. Al abrir la tumba, el cuerpo de Rosario ya no se encontraba exactamente como había sido dejado y el pañuelo que sujetaba sus manos aparecía desatado.
(Silencio profundo. Sólo se escucha el viento recorriendo los árboles.)
Algunos relatos incluso afirman que existían señales que parecían indicar movimiento dentro del ataúd. Desde ese momento comenzó a surgir una pregunta que todavía hoy sigue recorriendo los pasillos del Cementerio General.
¿Y si Rosario nunca estuvo realmente muerta?
¿Y si despertó cuando ya era demasiado tarde?
(Pausa breve. Hojas secas arrastradas por el viento y una campana de iglesia a la distancia.)
Nadie pudo comprobarlo y nadie pudo explicarlo. Quizás por eso esta historia continúa viva. Porque, más allá de si fue realidad o leyenda, Rosario representa uno de los mayores temores de la sociedad del siglo XIX: ser olvidado, ser sepultado antes de tiempo y enfrentarse a preguntas que nunca encuentran respuesta.
(El viento vuelve a sentirse entre los árboles. Se escuchan nuevamente los pasos del grupo sobre la gravilla.)
Por eso, mientras nos encontramos aquí, frente a este lugar cargado de historia, los invito a preguntarse qué creen ustedes.
Porque después de más de un siglo, el misterio de Rosario sigue esperando una respuesta.
(Los pasos continúan alejándose lentamente mientras el viento entre los cipreses vuelve a ser el único sonido.)

// 1. LÓGICA DE REPRODUCTORES MP3 INTERACTIVOS (Solo suena uno a la vez)
const players = document.querySelectorAll('.custom-player');
function formatTime(sec) {
if (isNaN(sec)) return '0:00';
const m = Math.floor(sec / 60);
const s = Math.floor(sec % 60);
return ${m}:${s < 10 ? '0' : ''}${s};
}
players.forEach(player => {
const audio = player.querySelector('audio');
const playBtn = player.querySelector('.play-btn');
const progressBar = player.querySelector('.progress-bar');
const currentSpan = player.querySelector('.current');
const durationSpan = player.querySelector('.duration');
audio.addEventListener('loadedmetadata', () => {
durationSpan.textContent = formatTime(audio.duration);
});
playBtn.addEventListener('click', () => {
// Pausar cualquier otro audio que esté sonando
players.forEach(other => {
const otherAudio = other.querySelector('audio');
const otherBtn = other.querySelector('.play-btn');
if (otherAudio !== audio && !otherAudio.paused) {
otherAudio.pause();
otherBtn.textContent = '▶';
}
});
if (audio.paused) {
audio.play().catch(() => {
alert('Aún no has subido el archivo MP3 correspondiente a este hito (' + audio.getAttribute('src') + ').');
});
playBtn.textContent = '❚❚';
} else {
audio.pause();
playBtn.textContent = '▶';
}
});
audio.addEventListener('timeupdate', () => {
if (audio.duration) {
progressBar.value = (audio.currentTime / audio.duration) * 100;
currentSpan.textContent = formatTime(audio.currentTime);
}
});
progressBar.addEventListener('input', () => {
if (audio.duration) {
audio.currentTime = (progressBar.value / 100) * audio.duration;
}
});
audio.addEventListener('ended', () => {
playBtn.textContent = '▶';
progressBar.value = 0;
currentSpan.textContent = '0:00';
});
});
// 2. DESPLEGABLE DE TRANSCRIPCIONES
document.querySelectorAll('.transcript-toggle').forEach(btn => {
btn.addEventListener('click', () => {
const content = btn.nextElementSibling;
const arrow = btn.querySelector('span:last-child');
const label = btn.querySelector('span:first-child');
const isOpen = content.classList.toggle('open');
arrow.textContent = isOpen ? '▴' : '▾';
label.textContent = isOpen ? 'Ocultar transcripción' : 'Leer transcripción';
});
});
// 3. MODAL Y ZOOM DEL MAPA
const mapModal = document.getElementById('mapModal');
const modalImg = document.getElementById('modalMapImg');
let currentZoom = 1;
function openModal() {
mapModal.classList.add('active');
currentZoom = 1;
modalImg.style.transform = scale(${currentZoom});
}
document.getElementById('openMapModal').addEventListener('click', openModal);
document.getElementById('btnOpenZoom').addEventListener('click', openModal);
document.getElementById('closeMapModal').addEventListener('click', () => {
mapModal.classList.remove('active');
});
document.getElementById('zoomInBtn').addEventListener('click', () => {
currentZoom = Math.min(currentZoom + 0.4, 3);
modalImg.style.transform = scale(${currentZoom});
});
document.getElementById('zoomOutBtn').addEventListener('click', () => {
currentZoom = Math.max(currentZoom - 0.4, 1);
modalImg.style.transform = scale(${currentZoom});
});
// 4. ENCUESTA DE SATISFACCIÓN
const stars = document.querySelectorAll('.star-btn');
let selectedRating = 0;
stars.forEach(star => {
star.addEventListener('click', () => {
selectedRating = Number(star.dataset.value);
stars.forEach(s => {
s.classList.toggle('active', Number(s.dataset.value) <= selectedRating);
});
});
});
document.getElementById('surveyForm').addEventListener('submit', (e) => {
e.preventDefault();
if (selectedRating === 0) {
alert('Por favor selecciona una calificación con las estrellas antes de enviar.');
return;
}
document.getElementById('surveyForm').style.display = 'none';
document.getElementById('surveyFeedback').style.display = 'block';
});
